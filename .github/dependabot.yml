version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: monthly
    # Só sugere versões publicadas há pelo menos 14 dias.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham o Node 22, que roda no CI e em produção.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Versão maior do TypeScript muda o compilador. A troca é avaliada à parte,
      # não por PR automático.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # Mesmo motivo da API: versão maior do TypeScript é avaliada à parte.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
