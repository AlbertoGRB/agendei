version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: monthly
    # Só sugere versões publicadas há pelo menos 14 dias.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      minor-e-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
